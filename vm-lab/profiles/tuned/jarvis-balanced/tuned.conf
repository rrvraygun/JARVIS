# Jarvis Acer Nitro 5 / Intel P-state balanced profile.
#
# This intentionally contains only controls exposed by this host.  Fedora's
# generic balanced profile also verifies cpufreq_conservative, per-CPU boost,
# energy_perf_bias labels, ACPI platform profiles, and ALPM on every SCSI host;
# those interfaces are absent or mismatched on this machine.

[main]
summary=Jarvis hardware-compatible balanced Intel P-state tuning

[cpu]
governor=powersave
energy_performance_preference=balance_performance

[audio]
timeout=10
